# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users should override settings configured in the IDE.
# For more information on Gradle settings visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
# Run the Kotlin compiler inside the Gradle daemon JVM instead of a separate Kotlin
# daemon process: peak memory stays bounded on low-RAM build machines.
kotlin.compiler.execution.strategy=in-process
# Enable Gradle build cache
org.gradle.caching=true
# Disable Configuration Cache (memory overhead; also avoids classloader retention)
org.gradle.configuration-cache=false
# Single-module project: parallel execution only adds memory pressure
org.gradle.parallel=false
# Kotlin incremental compilation
kotlin.incremental=true
# Caching for KSP
ksp.incremental=true
# AndroidX package structure to make it clearer which libraries are bundled with
# the Android operating system, and are packaged with the app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only
# the resources declared in the library itself and none from the resources of its dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
