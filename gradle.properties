# Project-wide Gradle settings — optimized for 4GB sandbox build
# JVM args reduced from 3072m to fit in available memory alongside R8/Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Disable parallel & config cache — they multiply memory usage in a constrained sandbox
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
org.gradle.workers.max=1
org.gradle.daemon=false

# Kotlin incremental compilation
kotlin.incremental=true
ksp.incremental=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# JDK 21 toolchain (Temurin at /home/z/jdk-21-temurin has javac; project targets Java 17)
org.gradle.java.installations.paths=/home/z/jdk-21-temurin
org.gradle.java.installations.auto-download=false

# Signing credentials for release builds (same keystore as Magen Play music app)
releaseKeyStore=/home/z/my-project/keystore/magen-play-release.jks
releaseKeyStorePassword=magen-play-2026
releaseKeyAlias=magen-play
releaseKeyPassword=magen-play-2026
